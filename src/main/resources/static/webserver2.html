<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application 2</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
        color: #14532d;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background-color: #ffffff;
        padding: 3rem;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(22, 163, 74, 0.15);
        border-top: 8px solid #16a34a;
        text-align: center;
        max-width: 450px;
        width: 100%;
      }
      h1 {
        color: #15803d;
        margin-bottom: 0.5rem;
        font-size: 2.2rem;
      }
      h3 {
        color: #4ade80;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 2rem;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .status-badge {
        background-color: #f0fdf4;
        color: #16a34a;
        padding: 0.5rem 1rem;
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: bold;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 1.5rem;
        border: 1px solid #bbf7d0;
      }
      .pulse {
        width: 8px;
        height: 8px;
        background-color: #16a34a;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
        animation: pulsing 1.5s infinite;
      }
      @keyframes pulsing {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 6px rgba(22, 163, 74, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(22, 163, 74, 0);
        }
      }
      p {
        color: #475569;
        line-height: 1.6;
        font-size: 0.95rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status-badge"><span class="pulse"></span> Live & Active</div>
      <h1>Welcome to application 2</h1>
      <h3>Version 1 - Deployed through Jenkins</h3>
      <p>
        Your CI/CD pipeline has successfully built and deployed this
        application. All systems are running smoothly, powered by automated
        Jenkins automation tooling.
      </p>
    </div>
  </body>
</html>
